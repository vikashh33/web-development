<!DOCTYPE html>
<html>
<head>
  <title>Box Layout</title>
</head>
<body>
  <table border="1" width="600" height="300" cellspacing="0">
    <tr height="150">
      <td width="120">1</td>
      <td width="180">2</td>
      <td width="300">3</td>
    </tr>
    <tr height="75">
      <td colspan="2" rowspan="2">4</td>
      <td>5</td>
    </tr>
    <tr height="75">
      <td>6</td>
    </tr>
  </table>
</body>
</html>
