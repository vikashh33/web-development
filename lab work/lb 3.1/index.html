<!DOCTYPE html>
<html>
<head>
  <title>Colspan Layout</title>
</head>
<body>
  <table border="1" width="400" height="400" cellspacing="0">
    <tr>
      <td width="200" height="200" colspan="2" align="center">colspan=2</td>
    </tr>
    <tr>
      <td width="200" height="200"></td>
      <td width="200" height="200"></td>
    </tr>
  </table>
</body>
</html>
